<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 12px;
        font-size: 12px;
      }
      label {
        display: block;
        margin-top: 8px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        margin-top: 2px;
        padding: 4px 6px;
      }
      button {
        margin-top: 12px;
        padding: 6px 10px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
      .hint {
        margin-top: 8px;
        color: #666;
        line-height: 1.3;
      }
      .hidden {
        display: none;
      }
      .error {
        margin-top: 8px;
        color: #b00020;
        white-space: pre-wrap;
      }
      .ok {
        margin-top: 8px;
        color: #1b7f3a;
      }
    </style>
  </head>
  <body>
    <div>
      <label>
        API URL
        <input id="apiUrl" placeholder="http://localhost:8081" />
      </label>

      <!-- ✅ NEW: login section -->
      <div id="loginSection">
        <div class="row">
          <label>
            Email
            <input id="email" placeholder="you@example.com" />
          </label>

          <label>
            Password
            <input id="password" type="password" placeholder="••••••••" />
          </label>
        </div>

        <button id="login">Login</button>
        <div id="loginStatus" class="hint">
          Login to load your Design Systems.
        </div>
        <div id="loginError" class="error hidden"></div>
      </div>

      <!-- ✅ CHANGED: DS id input -> DS dropdown (still stores designSystemId) -->
      <div id="dsSection" class="hidden">
        <label>
          Design System
          <select id="designSystemSelect" disabled>
            <option value="">— Select —</option>
          </select>
        </label>

        <button id="save">Save settings</button>

        <div id="saveStatus" class="ok hidden"></div>
        <div id="dsError" class="error hidden"></div>
      </div>
    </div>

    <script>
      const dsSection = document.getElementById("dsSection");
      const apiInput = document.getElementById("apiUrl");
      const dsSelect = document.getElementById("designSystemSelect");
      const saveBtn = document.getElementById("save");

      const loginBtn = document.getElementById("login");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginStatus = document.getElementById("loginStatus");
      const loginError = document.getElementById("loginError");
      const saveStatus = document.getElementById("saveStatus");
      const dsError = document.getElementById("dsError");

      let currentApiUrl = "";
      let initialDesignSystemId = "";
      let hasJwt = false;

      function setHidden(el, hidden) {
        if (!el) return;
        el.classList.toggle("hidden", !!hidden);
      }

      function setText(el, text) {
        if (!el) return;
        el.textContent = text || "";
      }

      function normalizeApiUrl(url) {
        return String(url || "")
          .trim()
          .replace(/\/$/, "");
      }

      function clearSelect(selectEl) {
        while (selectEl.options.length > 0) selectEl.remove(0);
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "— Select —";
        selectEl.appendChild(opt);
      }

      function setSelectValue(selectEl, value) {
        if (!value) return;
        const options = Array.from(selectEl.options);
        const match = options.find((o) => o.value === value);
        if (match) selectEl.value = value;
      }

      async function apiFetch(path, opts) {
        const base = normalizeApiUrl(currentApiUrl);
        const url = base + path;
        const res = await fetch(url, opts);
        return res;
      }

      // ✅ NEW: login -> sends jwt back to plugin (code.js stores it globally)
      async function doLogin() {
        setHidden(loginError, true);
        setText(loginError, "");
        setText(loginStatus, "Logging in…");

        const email = String(emailInput.value || "").trim();
        const password = String(passwordInput.value || "");

        if (!email || !password) {
          setText(loginStatus, "Please enter email + password.");
          return;
        }

        try {
          const res = await apiFetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const text = await res.text();
          let data = null;
          try {
            data = JSON.parse(text);
          } catch (_) {}

          if (!res.ok) {
            setHidden(loginError, false);
            setText(
              loginError,
              (data && (data.message || data.error)) || text || "Login failed."
            );
            setText(loginStatus, "Login failed.");
            return;
          }

          // adjust token field names depending on your backend response
          const jwt =
            (data && (data.token || data.jwt || data.accessToken)) || null;

          if (!jwt) {
            setHidden(loginError, false);
            setText(
              loginError,
              "Login response did not include a token (expected token/jwt/accessToken)."
            );
            setText(loginStatus, "Login failed.");
            return;
          }

          parent.postMessage(
            { pluginMessage: { type: "login-success", jwt } },
            "*"
          );

          hasJwt = true;
          setText(loginStatus, "Logged in ✓ Loading Design Systems…");
          setHidden(dsSection, false);

          await loadDesignSystems(jwt);
          setText(loginStatus, "Logged in ✓");
        } catch (err) {
          setHidden(loginError, false);
          setText(loginError, err && err.message ? err.message : String(err));
          setText(loginStatus, "Login failed.");
        }
      }

      async function loadDesignSystems(jwt) {
        setHidden(dsError, true);
        setText(dsError, "");

        clearSelect(dsSelect);
        dsSelect.disabled = true;

        try {
          const res = await apiFetch("/api/design-systems", {
            method: "GET",
            headers: {
              Authorization: "Bearer " + jwt,
            },
          });

          const text = await res.text();
          let data = null;
          try {
            data = JSON.parse(text);
          } catch (_) {}

          if (!res.ok) {
            setHidden(dsError, false);
            setText(
              dsError,
              (data && (data.message || data.error)) ||
                text ||
                "Failed to load design systems."
            );
            return;
          }

          // Accept either { items: [...] } or [...] formats
          const items = Array.isArray(data)
            ? data
            : data && data.items
            ? data.items
            : [];

          for (const ds of items) {
            const id = ds && (ds._id || ds.id);
            if (!id) continue;
            const name = (ds && (ds.name || ds.title)) || id;

            const opt = document.createElement("option");
            opt.value = id;
            opt.textContent = name;
            dsSelect.appendChild(opt);
          }

          dsSelect.disabled = false;

          // restore DS if saved for this file
          setSelectValue(dsSelect, initialDesignSystemId);
        } catch (err) {
          setHidden(dsError, false);
          setText(dsError, err && err.message ? err.message : String(err));
        }
      }

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;

        if (msg && msg.type === "init-settings") {
          currentApiUrl = msg.apiUrl || "";
          apiInput.value = msg.apiUrl || "";
          initialDesignSystemId = msg.designSystemId || "";
          hasJwt = !!msg.hasJwt;
          setHidden(dsSection, true);
          dsSelect.disabled = true;
          clearSelect(dsSelect);

          setText(
            loginStatus,
            hasJwt
              ? "Logged in ✓ Loading Design Systems…"
              : "Login to load your Design Systems."
          );
          return;
        }

        if (msg && msg.type === "design-systems") {
          clearSelect(dsSelect);

          const items = Array.isArray(msg.items) ? msg.items : [];
          for (const ds of items) {
            const id = ds && (ds._id || ds.id);
            if (!id) continue;
            const name = (ds && (ds.name || ds.title)) || id;

            const opt = document.createElement("option");
            opt.value = id;
            opt.textContent = name;
            dsSelect.appendChild(opt);
          }

          dsSelect.disabled = false;
          setSelectValue(dsSelect, initialDesignSystemId);
          setText(
            loginStatus,
            hasJwt ? "Logged in ✓" : "Login to load your Design Systems."
          );
          return;
        }

        if (msg && msg.type === "design-systems-error") {
          setHidden(dsError, false);
          setText(dsError, msg.message || "Failed to load design systems.");
          return;
        }
      };

      loginBtn.onclick = () => doLogin();

      saveBtn.onclick = () => {
        setHidden(saveStatus, true);
        setText(saveStatus, "");

        const apiUrl = normalizeApiUrl(apiInput.value);
        const designSystemId = dsSelect.value;

        if (!designSystemId) {
          setHidden(dsError, false);
          setText(dsError, "Please select a Design System.");
          return;
        }

        parent.postMessage(
          {
            pluginMessage: {
              type: "save-settings",
              apiUrl,
              designSystemId,
            },
          },
          "*"
        );

        setHidden(saveStatus, false);
        setText(saveStatus, "Saved ✓");
      };
    </script>
  </body>
</html>
